[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "xgtest"
version = "0.1.0"
description = "XG DB Test framework"
requires-python = ">=3.11,<3.15"
dependencies = [
  "pydantic>=2.12,<3",
  "PyYAML>=6.0.3,<7",
]

[project.optional-dependencies]
dev = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "jsonschema>=4.25,<5",
  "pytest>=9,<10",
]
web = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
]

[project.scripts]
xgtest = "xgtest.cli:main"

[tool.pytest.ini_options]
testpaths = ["framework_tests"]
addopts = ["-q"]
markers = [
  "xugu_integration: requires a reachable real Xugu target and project driver",
]

[tool.setuptools.packages.find]
where = ["src"]
