[build-system]
requires = ["setuptools>=80"]
build-backend = "setuptools.build_meta"

[project]
name = "xgtest"
version = "0.1.0"
description = "XG DB Test framework"
requires-python = ">=3.14,<3.15"
dependencies = [
  "pydantic>=2.12,<3",
  "PyYAML>=6.0.3,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=9,<10",
]

[project.scripts]
xgtest = "xgtest.cli:main"

[tool.pytest.ini_options]
testpaths = ["framework_tests"]
addopts = ["-q"]

[tool.setuptools.packages.find]
where = ["src"]

\n