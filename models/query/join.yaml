model_id: query.join
model_version: "2"
module: query
feature: query
subfeature: join
dimensions:
  join_type:
    values: [inner, left, right, full, cross]
  predicate:
    values: [none, equality, inequality, less_equal]
  datatype:
    values: [int, varchar, date]
  null_side:
    values: [none, left, right, both]
  interaction:
    values: [none, where, group_by, subquery]
coverage:
  strategies:
    - type: all_values
    - type: pairwise
      strength: 2
constraints:
  - if: {join_type: cross}
    then: {predicate: none, null_side: none}
  - if: {join_type: cross}
    exclude: {interaction: [subquery]}
  - if: {predicate: none}
    then: {join_type: cross, null_side: none}
  - if: {join_type: inner}
    then: {null_side: none}
  - if: {join_type: left}
    exclude: {null_side: [left, both]}
  - if: {join_type: right}
    exclude: {null_side: [right, both]}
